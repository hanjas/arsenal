<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe — &lt;screen&gt;</title>
<!--
  Grey-box wireframe BASE. Copy this file per screen into
  .claude/loadout/<feature-slug>/ui/wireframes/<screen>.html and fill the regions with labelled boxes.
  Rules: neutral greys only, system font, labelled boxes, NO brand styling, NO color.
  This is a layout sketch, not a styled design.
-->
<style>
  :root{
    --bg:#f5f5f5; --box:#e9e9e9; --box-2:#dedede; --line:#c2c2c2;
    --ink:#333; --ink-2:#6b6b6b; --radius:4px; --gap:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
  .frame{max-width:1440px;margin:0 auto;padding:var(--gap);display:grid;gap:var(--gap);
         grid-template-columns:220px 1fr;
         grid-template-areas:"nav header" "nav main" "nav footer";}
  .box{background:var(--box);border:1px dashed var(--line);border-radius:var(--radius);
       padding:var(--gap);min-height:48px}
  .box .box{background:var(--box-2)}
  .label{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .stack>*+*{margin-top:var(--gap)}
  [data-region=nav]{grid-area:nav;min-height:320px}
  [data-region=header]{grid-area:header}
  [data-region=main]{grid-area:main;min-height:320px}
  [data-region=footer]{grid-area:footer}
  @media (max-width:768px){
    .frame{grid-template-columns:1fr;grid-template-areas:"header" "nav" "main" "footer"}
    [data-region=nav]{min-height:auto}
  }
</style>
</head>
<body>
  <main class="frame">
    <section class="box" data-region="nav"><div class="label">Nav</div></section>
    <section class="box" data-region="header"><div class="label">Header / Topbar</div></section>
    <section class="box stack" data-region="main">
      <div class="label">Main — &lt;screen&gt;</div>
      <div class="box"><div class="label">Content block</div></div>
      <div class="box"><div class="label">Content block</div></div>
    </section>
    <section class="box" data-region="footer"><div class="label">Footer</div></section>
  </main>
</body>
</html>
